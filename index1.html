<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkmenistan Başkonsolosluğu Belge Doğrulama</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --danger: #ea4335;
            --dark-text: #202124;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: var(--dark-text);
        }
        .header {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        .form-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-top: -50px;
            position: relative;
            z-index: 10;
        }
        .result-card {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1rem;
            border-radius: 8px;
            padding: 20px;
        }
        .success-result {
            background-color: rgba(52, 168, 83, 0.1);
            border-left: 5px solid var(--success);
        }
        .error-result {
            background-color: rgba(234, 67, 53, 0.1);
            border-left: 5px solid var(--danger);
        }
        .spinner-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        footer {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="display-5 fw-bold"><i class="fas fa-file-contract me-2"></i> Belge Doğrulama Sistemi</h1>
            <p class="lead">Türkmenistan Başkonsolosluğu tarafından verilen belgelerin geçerliliğini sorgulayın.</p>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container">
                    <h2 class="text-center mb-3 fw-bold">Belge Sorgulama</h2>
                    <p class="text-center text-muted mb-4">Lütfen doğrulamak istediğiniz belgenin bilgilerini giriniz.</p>
                    <form id="verification-form">
                        <div class="mb-3">
                            <label for="document-number" class="form-label fw-bold">Belge Numarası</label>
                            <input type="text" class="form-control form-control-lg" id="document-number" placeholder="Örn: 12345/2024" required>
                        </div>
                        <div class="mb-3">
                            <label for="document-date" class="form-label fw-bold">Belge Tarihi</label>
                            <input type="text" class="form-control form-control-lg" id="document-date" placeholder="GG/AA/YYYY" required>
                            <div class="form-text">Örnek: 15/07/2023</div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-search me-2"></i>Sorgula
                            </button>
                        </div>
                    </form>
                    <div class="result-card mt-4 d-none" id="result-container">
                        <div id="verification-result"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="text-center">
        <p class="mb-0">&copy; 2024 Türkmenistan Başkonsolosluğu. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Spinner -->
    <div class="spinner-container" id="spinner-container">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Yükleniyor...</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        let firebaseConfig;
        let initialAuthToken;
        if (typeof __firebase_config !== 'undefined' && typeof __initial_auth_token !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
            initialAuthToken = __initial_auth_token;
        } else {
            // Provide your own fallback config for local testing
            firebaseConfig = {
                apiKey: "AIzaSyAzBBgPme5oA1xWBp3o8c0kk_65TcWBDEk",
                authDomain: "turkmenistan-consulate.firebaseapp.com",
                projectId: "turkmenistan-consulate",
                storageBucket: "turkmenistan-consulate.appspot.com",
                messagingSenderId: "257518915632",
                appId: "1:257518915632:web:0a069b8a563428336e9df5",
                measurementId: "G-4VEHZYBFF2"
            };
            initialAuthToken = null;
        }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- Firebase Initialization ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('debug');

        const documentsCollectionPath = `/artifacts/${appId}/public/data/belgeler`;
        const documentsCollectionRef = collection(db, documentsCollectionPath);

        // --- UI Helper ---
        function showSpinner(show) { document.getElementById('spinner-container').style.display = show ? 'flex' : 'none'; }
        
        // --- Authentication ---
        onAuthStateChanged(auth, async (user) => {
             if (!user) {
                try {
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                } catch (error) {
                    console.error("Authentication Error:", error);
                    alert(`Kimlik doğrulama başarısız oldu. Lütfen sayfayı yenileyin.`);
                }
            }
        });

        // --- Verification Logic ---
        document.getElementById('verification-form').addEventListener('submit', (e) => {
            e.preventDefault();
            verifyDocument();
        });

        async function verifyDocument() {
            const docNumber = document.getElementById('document-number').value.trim();
            const docDate = document.getElementById('document-date').value.trim();
            const resultContainer = document.getElementById('result-container');
            const resultElement = document.getElementById('verification-result');

            if (!docNumber || !docDate) {
                showResult(false, 'Lütfen belge numarası ve tarih alanlarını eksiksiz doldurun.');
                return;
            }

            showSpinner(true);
            resultContainer.classList.add('d-none');

            try {
                const q = query(documentsCollectionRef, 
                                where("belgeNo", "==", docNumber), 
                                where("belgeTarihi", "==", docDate));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const docData = querySnapshot.docs[0].data();
                    if (docData.gecerli) {
                        showResult(true, `
                            <h4 class="text-success fw-bold">BELGE DOĞRULANDI</h4>
                            <p class="mb-1"><strong>Belge No:</strong> ${docData.belgeNo}</p>
                            <p class="mb-1"><strong>Tarih:</strong> ${docData.belgeTarihi}</p>
                            <p class="mb-1"><strong>Adı Soyadı:</strong> ${docData.adSoyad}</p>
                            <p class="mt-2 small">Bu belge sistemimizde kayıtlıdır ve geçerlidir.</p>
                        `);
                    } else {
                         showResult(false, `
                            <h4 class="text-danger fw-bold">BELGE GEÇERSİZ</h4>
                            <p class="mb-1"><strong>Belge No:</strong> ${docData.belgeNo}</p>
                            <p class="mb-1"><strong>Tarih:</strong> ${docData.belgeTarihi}</p>
                            <p class="mt-2 small">Bu belge sistemimizde kayıtlıdır ancak <strong>geçerli DEĞİLDİR</strong>.</p>
                        `);
                    }
                } else {
                    showResult(false, `
                        <h4 class="text-danger fw-bold">BELGE BULUNAMADI</h4>
                        <p class="mt-2 small">Girilen bilgilere uyan bir kayıt bulunamadı. Lütfen bilgilerinizi kontrol edip tekrar deneyiniz.</p>
                    `);
                }
            } catch (error) {
                console.error("Verification error:", error);
                showResult(false, 'Sistemsel bir hata oluştu. Lütfen daha sonra tekrar deneyin.');
            } finally {
                showSpinner(false);
            }
        }
        
        function showResult(isSuccess, message) {
            const resultContainer = document.getElementById('result-container');
            const resultElement = document.getElementById('verification-result');
            
            resultContainer.classList.remove('d-none', 'success-result', 'error-result');
            resultContainer.classList.add(isSuccess ? 'success-result' : 'error-result');
            
            const icon = isSuccess 
                ? '<div class="text-success mb-2"><i class="fas fa-check-circle fa-3x"></i></div>'
                : '<div class="text-danger mb-2"><i class="fas fa-times-circle fa-3x"></i></div>';
                
            resultElement.innerHTML = icon + message;
        }

    </script>
</body>
</html>
